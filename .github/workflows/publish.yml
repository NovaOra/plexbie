# Publishes the Docker image (bot and website in one) to the GitHub Container
# Registry once the tests have passed on main, and for every version tag.
#   ghcr.io/novaora/plexbie:latest    newest main
#   ghcr.io/novaora/plexbie:1.2.3     a v1.2.3 tag
#   ghcr.io/novaora/plexbie:sha-...   any published commit
# The Unraid template (unraid/plexbie.xml) installs :latest.
# Actions are pinned to commits (Dependabot keeps them current), since this job
# can push the image everyone installs.
name: publish

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # From a tests run: only when they passed, on a push to this repository's own
    # main. A pull request from a fork runs the tests too, and its branch may also
    # be called "main"; without these checks its code would be published as :latest.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/plexbie
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Plexbie
            org.opencontainers.image.description=A Discord bot and website for a household's Plex server
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
